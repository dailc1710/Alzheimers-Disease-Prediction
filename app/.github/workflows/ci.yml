name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Static type check
        continue-on-error: true
        run: mypy ml_pipeline.py scripts --ignore-missing-imports --follow-imports=skip
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - name: Test with coverage
        run: pytest --cov=ml_pipeline --cov-report=term-missing --cov-fail-under=80
      - name: Verify active artifact
        run: python scripts/verify_artifact.py
