[project]
name = "alzheimer-screening"
version = "3.0.0"
description = "Reproducible Alzheimer's disease screening research application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["archive", "artifacts", "data", ".venv", ".testvenv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
